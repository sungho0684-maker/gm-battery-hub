<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>국민배터리 지점 단가표</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif;background:#f4f6fa;color:#1f2733;font-size:15px}
.wrap{max-width:1100px;margin:0 auto;padding:0 12px 60px}
header{background:linear-gradient(135deg,#1e3a5f,#2d5a8e);color:#fff;padding:18px 16px 16px;margin:0 -12px 14px}
header h1{margin:0;font-size:1.15rem;font-weight:800;letter-spacing:-.3px}
header p{margin:5px 0 0;font-size:.76rem;opacity:.85;line-height:1.5}
/* 잠금 */
#lock{position:fixed;inset:0;background:linear-gradient(135deg,#1e3a5f,#2d5a8e);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
#lockbox{background:#fff;border-radius:18px;padding:30px 24px;width:100%;max-width:340px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.3)}
#lockbox h2{margin:0 0 6px;font-size:1.05rem;color:#1e3a5f}
#lockbox p{margin:0 0 18px;font-size:.8rem;color:#78849a}
#pw{width:100%;padding:13px;font-size:1.1rem;text-align:center;border:2px solid #d6dced;border-radius:11px;letter-spacing:2px;font-family:inherit}
#pw:focus{outline:none;border-color:#2d5a8e}
#go{width:100%;margin-top:11px;padding:13px;background:#2d5a8e;color:#fff;border:none;border-radius:11px;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit}
#err{margin-top:11px;font-size:.82rem;color:#c0392b;font-weight:700;min-height:18px}
/* 지점 */
.stores{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.st{flex:1;min-width:78px;padding:11px 6px;background:#fff;border:2px solid #e2e7f0;border-radius:12px;text-align:center;cursor:pointer;font-weight:800;font-size:.86rem;color:#5a6478;transition:.12s}
.st b{display:block;font-size:.68rem;font-weight:600;color:#98a1b3;margin-top:3px}
.st.on{background:#1e3a5f;border-color:#1e3a5f;color:#fff}
.st.on b{color:rgba(255,255,255,.72)}
/* 탭 */
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tb{flex:1;padding:11px;background:#fff;border:1px solid #e2e7f0;border-radius:11px;text-align:center;font-weight:800;font-size:.9rem;cursor:pointer;color:#5a6478}
.tb.on{background:#2d5a8e;border-color:#2d5a8e;color:#fff}
/* 필터 */
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bd{padding:7px 13px;background:#fff;border:1px solid #e2e7f0;border-radius:9px;font-size:.83rem;font-weight:700;cursor:pointer;color:#5a6478}
.bd.on{background:#e8f0fb;border-color:#2d5a8e;color:#1e3a5f}
#q{flex:1;min-width:130px;padding:9px 12px;border:1px solid #e2e7f0;border-radius:9px;font-size:.88rem;font-family:inherit}
#q:focus{outline:none;border-color:#2d5a8e}
/* 표 */
.sec{margin:16px 0 6px;font-weight:800;font-size:.9rem;color:#1e3a5f;padding-left:3px}
.card{background:#fff;border:1px solid #e6eaf2;border-radius:12px;padding:11px 13px;margin-bottom:7px}
.nm{font-weight:800;font-size:.93rem;margin-bottom:8px;color:#1f2733}
.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.p{padding:7px 4px;border-radius:8px;background:#f7f9fc;text-align:center;border:1px solid transparent}
.p .l{font-size:.66rem;color:#98a1b3;font-weight:700;margin-bottom:2px}
.p .v{font-size:.9rem;font-weight:800;font-variant-numeric:tabular-nums}
.p.low{background:#e8f6f0;border-color:#0f9d8f}
.p.low .v{color:#0b7a6e}
.p.mine{border-color:#2d5a8e;background:#eaf1fb}
.p.mine .l{color:#2d5a8e}
.p.na .v{color:#c8cedb;font-weight:600}
.gap{margin-top:7px;font-size:.75rem;color:#c0392b;line-height:1.5;text-align:right}
.gap .z{color:#0f9d8f;font-weight:700}
.mytag{display:inline-block;font-size:.62rem;background:#2d5a8e;color:#fff;padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:2px}
/* 마진 */
.frm{background:#fff;border:1px solid #e6eaf2;border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;margin-bottom:9px;align-items:center}
.row label{width:82px;font-size:.82rem;font-weight:700;color:#5a6478;flex-shrink:0}
.row input,.row select{flex:1;padding:9px 11px;border:1px solid #e2e7f0;border-radius:9px;font-size:.92rem;font-family:inherit;min-width:0}
.row input:focus,.row select:focus{outline:none;border-color:#2d5a8e}
.seg{display:flex;gap:5px;flex:1}
.sg{flex:1;padding:9px;border:1px solid #e2e7f0;background:#fff;border-radius:9px;font-size:.83rem;font-weight:700;cursor:pointer;color:#5a6478;font-family:inherit}
.sg.on{background:#2d5a8e;border-color:#2d5a8e;color:#fff}
.res{background:#fff;border:1px solid #e6eaf2;border-radius:12px;overflow:hidden}
.rh{padding:9px 14px;font-weight:800;font-size:.84rem;color:#fff}
.rl{display:flex;justify-content:space-between;padding:7px 14px;font-size:.86rem;border-bottom:1px solid #f0f3f8}
.rl b{font-variant-numeric:tabular-nums}
.rt{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:800}
.rt .v{font-size:1.35rem;font-variant-numeric:tabular-nums}
.note{font-size:.73rem;color:#8b93a5;line-height:1.6;margin-top:14px;padding:11px 13px;background:#eef1f6;border-radius:10px}
@media(max-width:560px){
 .prices{grid-template-columns:repeat(2,1fr)}
 .row label{width:70px;font-size:.78rem}
 body{font-size:14px}
}
</style></head><body>
<div id="lock"><div id="lockbox">
  <h2>🔋 국민배터리 지점 단가표</h2>
  <p>지점에 공유된 암호를 입력하세요</p>
  <input id="pw" type="password" inputmode="text" autocomplete="off" placeholder="암호">
  <button id="go">열기</button>
  <div id="err"></div>
</div></div>

<div class="wrap" id="app" style="display:none">
<header>
  <h1>🔋 국민배터리 지점 단가표</h1>
  <p><b>2026년 9월 인상단가 기준</b> · VAT 별도 · 실매입가 기준<br>
  ※ 현재 실제 적용단가는 <b>인상 전</b>입니다. 이 표는 인상 후 미리보기입니다.</p>
</header>

<div class="stores" id="stores"></div>
<div class="tabs">
  <div class="tb on" data-t="cmp">📊 단가 비교</div>
  <div class="tb" data-t="mgn">💰 마진 계산</div>
</div>

<div id="tab-cmp">
  <div class="bar" id="brands"></div>
  <div class="bar"><input id="q" placeholder="규격 검색 (GB57820, AGM80, DIN74 …)"></div>
  <div id="list"></div>
</div>

<div id="tab-mgn" style="display:none">
  <div class="frm">
    <div class="row"><label>제품</label><select id="mItem"></select></div>
    <div class="row"><label>매입가</label><input id="mBuy" type="number" inputmode="numeric"></div>
    <div class="row"><label>판매가</label><input id="mSell" type="number" inputmode="numeric" placeholder="예: 150000"></div>
    <div class="row"><label>결제</label><div class="seg" id="mPay">
      <button class="sg on" data-f="0.002">카드 0.2%</button>
      <button class="sg" data-f="0.05">스스 5%</button>
      <button class="sg" data-f="0">현금 0%</button></div></div>
    <div class="row"><label>폐전지</label><div class="seg" id="mWst">
      <button class="sg on" data-w="1">반납 받음</button>
      <button class="sg" data-w="0">없음</button></div></div>
    <div class="row"><label>단가/무게</label>
      <input id="mRate" type="number" inputmode="numeric" value="1320" style="flex:.9">
      <input id="mKg" type="number" inputmode="decimal" step="0.5" style="flex:.7" placeholder="kg"></div>
  </div>
  <div class="res" id="mRes"></div>
  <div class="note">※ 폐전지 매각액은 <b>공급가 + VAT</b>로 들어옵니다(kg × 단가 × 1.1).<br>
  ※ 부가세 = 매출세액 + 폐전지세액 − 매입세액 − 수수료세액. 세후순익 = 현금마진 − 납부부가세.<br>
  ※ 택배 판매는 CJ 운임이 추가로 빠지므로 이 계산과 다릅니다(매장 기준).</div>
</div>

<div class="note" id="foot"></div>
</div>

  STORE=STORES.filter(function(s){return s.k===sv;})[0]||STORES[0];
  document.getElementById('stores').innerHTML=STORES.map(function(s){
    return '<div class="st'+(s.k===STORE.k?' on':'')+'" data-k="'+s.k+'">'+s.n+'<b>'+s.d+'</b></div>';}).join('');
  document.getElementById('brands').innerHTML=DB.brands.map(function(b){
    return '<div class="bd'+(b===BRAND?' on':'')+'" data-b="'+b+'">'+b+'</div>';}).join('');
  document.getElementById('foot').innerHTML='기준: '+DB.meta.date+' · 영도만 <b>협력할인 3%</b> 적용(정가×0.97), 퍼스트·SB·영창은 <b>할인 없음</b>(표시가=매입가).<br>'
    +'지점 매핑: 본점·동부산점=영도/퍼스트 · 서부점=SB · 서울점=영창. 문의는 대표에게.';
  bind(); render(); fillItems();
}
function bind(){
  document.getElementById('stores').onclick=function(e){
    var t=e.target.closest('.st'); if(!t)return;
    STORE=STORES.filter(function(s){return s.k===t.dataset.k;})[0];
    try{localStorage.setItem('kbp_store',STORE.k);}catch(x){}
    [].forEach.call(document.querySelectorAll('.st'),function(x){x.classList.toggle('on',x.dataset.k===STORE.k);});
    render(); fillItems(); calc();
  };
  document.getElementById('brands').onclick=function(e){
    var t=e.target.closest('.bd'); if(!t)return;
    BRAND=t.dataset.b;
    [].forEach.call(document.querySelectorAll('.bd'),function(x){x.classList.toggle('on',x.dataset.b===BRAND);});
    render(); fillItems();
  };
  document.getElementById('q').oninput=render;
  [].forEach.call(document.querySelectorAll('.tb'),function(t){t.onclick=function(){
    [].forEach.call(document.querySelectorAll('.tb'),function(x){x.classList.remove('on');});
    t.classList.add('on');
    document.getElementById('tab-cmp').style.display=(t.dataset.t==='cmp')?'':'none';
    document.getElementById('tab-mgn').style.display=(t.dataset.t==='mgn')?'':'none';
  };});
  ['mBuy','mSell','mRate','mKg'].forEach(function(id){document.getElementById(id).oninput=calc;});
  document.getElementById('mItem').onchange=function(){pickItem();calc();};
  ['mPay','mWst'].forEach(function(id){document.getElementById(id).onclick=function(e){
    var t=e.target.closest('.sg'); if(!t)return;
    [].forEach.call(this.querySelectorAll('.sg'),function(x){x.classList.remove('on');});
    t.classList.add('on'); calc();};});
}
function price(r,k){ var v=r[k]; if(v==null)return null; return (k==='yd')?Math.round(v*0.97):v; }
function render(){
  var q=(document.getElementById('q').value||'').trim().toLowerCase();
  var rows=DB.rows.filter(function(r){return r.b===BRAND;});
  if(q) rows=rows.filter(function(r){return (r.n+' '+r.c).toLowerCase().indexOf(q)>=0;});
  var h='',lastc=null;
  rows.forEach(function(r){
    if(r.c!==lastc){h+='<div class="sec">'+r.c+'</div>';lastc=r.c;}
    var vals={},min=null;
    SUPKEY.forEach(function(k){var v=price(r,k);vals[k]=v;if(v!=null&&(min==null||v<min))min=v;});
    h+='<div class="card"><div class="nm">'+r.n+'</div><div class="prices">';
    SUPKEY.forEach(function(k){
      var v=vals[k],cls='p';
      if(v==null)cls+=' na';
      else{ if(v===min)cls+=' low'; if(STORE.s.indexOf(k)>=0)cls+=' mine'; }
      h+='<div class="'+cls+'"><div class="l">'+SUPNM[k]+(STORE.s.indexOf(k)>=0?' ★':'')+'</div><div class="v">'+won(v)+'</div></div>';
    });
    h+='</div>';
    var gaps=SUPKEY.filter(function(k){return vals[k]!=null&&vals[k]!==min;})
                   .map(function(k){return SUPNM[k]+' +'+won(vals[k]-min);});
    if(gaps.length) h+='<div class="gap">'+gaps.join(' · ')+'</div>';
    else h+='<div class="gap"><span class="z">전 업체 동일</span></div>';
    h+='</div>';
  });
  document.getElementById('list').innerHTML=h||'<div class="card" style="text-align:center;color:#98a1b3">검색 결과 없음</div>';
}
function myPrice(r){ for(var i=0;i<STORE.s.length;i++){var v=price(r,STORE.s[i]); if(v!=null)return v;} return null; }
function fillItems(){
  var rows=DB.rows.filter(function(r){return r.b===BRAND&&myPrice(r)!=null;});
  document.getElementById('mItem').innerHTML=rows.map(function(r,i){
    return '<option value="'+r.i+'">'+r.b+' '+r.n+' — '+won(myPrice(r))+'원</option>';}).join('')
    ||'<option value="">해당 없음</option>';
  pickItem();calc();
}
function pickItem(){
  var id=document.getElementById('mItem').value;
  var r=DB.rows.filter(function(x){return String(x.i)===String(id);})[0];
  if(!r)return;
  document.getElementById('mBuy').value=myPrice(r)||'';
  document.getElementById('mKg').value=r.w||'';
}
function calc(){
  var buy=+document.getElementById('mBuy').value||0, sell=+document.getElementById('mSell').value||0;
  var fee=+document.querySelector('#mPay .sg.on').dataset.f;
  var wOn=document.querySelector('#mWst .sg.on').dataset.w==='1';
  var rate=+document.getElementById('mRate').value||0, kg=+document.getElementById('mKg').value||0;
  var box=document.getElementById('mRes');
  if(!sell||!buy){box.innerHTML='<div class="rh" style="background:#98a1b3">판매가를 입력하세요</div>';return;}
  var bv=Math.round(buy*1.1);
  var ws=wOn?Math.round(kg*rate):0, wt=Math.round(ws*1.1);
  var fe=Math.round(sell*fee);
  var cash=sell+wt-bv-fe;
  var vat=Math.round(sell/1.1*0.1 + ws*0.1 - buy*0.1 - fe/1.1*0.1);
  var net=cash-vat, pos=net>=0;
  box.innerHTML='<div class="rh" style="background:'+(pos?'#0f9d8f':'#c0392b')+'">'+(pos?'💰':'⚠️')+' 계산 결과</div>'
   +'<div class="rl"><span>판매가</span><b>+'+won(sell)+'</b></div>'
   +(wOn?'<div class="rl"><span>폐전지 매각 ('+kg+'kg)</span><b>+'+won(wt)+'</b></div>':'')
   +'<div class="rl"><span>배터리 매입 (VAT포함)</span><b>-'+won(bv)+'</b></div>'
   +(fe?'<div class="rl"><span>결제 수수료</span><b>-'+won(fe)+'</b></div>':'')
   +'<div class="rl" style="background:#f7f9fc;font-weight:700"><span>현금 마진</span><b>'+won(cash)+'</b></div>'
   +'<div class="rl"><span>납부 부가세</span><b>-'+won(vat)+'</b></div>'
   +'<div class="rt" style="background:'+(pos?'#e8f6f0':'#fdecea')+';color:'+(pos?'#0b7a6e':'#c0392b')+'">'
   +'<span>세후 순익</span><span class="v">'+won(net)+'원</span></div>';
}
</script></body></html>
