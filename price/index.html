<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>국민배터리 지점 단가표</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif;
 background:#eef1f6;color:#1b2431;font-size:15px;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 12px 70px}
header{background:linear-gradient(135deg,#16324f,#2b5f96);color:#fff;padding:16px 16px 14px;margin:0 -12px 0}
header h1{margin:0;font-size:1.1rem;font-weight:800;letter-spacing:-.3px}
header .sub{margin-top:4px;font-size:.73rem;opacity:.82;line-height:1.5}
/* 잠금 */
#lock{position:fixed;inset:0;background:linear-gradient(135deg,#16324f,#2b5f96);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
#lockbox{background:#fff;border-radius:18px;padding:30px 24px;width:100%;max-width:330px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.3)}
#lockbox h2{margin:0 0 6px;font-size:1.02rem;color:#16324f}
#lockbox p{margin:0 0 18px;font-size:.79rem;color:#7b8698}
#pw{width:100%;padding:13px;font-size:1.05rem;text-align:center;border:2px solid #d8dee9;border-radius:11px;letter-spacing:2px;font-family:inherit}
#pw:focus{outline:none;border-color:#2b5f96}
#go{width:100%;margin-top:11px;padding:13px;background:#2b5f96;color:#fff;border:none;border-radius:11px;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit}
#err{margin-top:11px;font-size:.82rem;color:#c0392b;font-weight:700;min-height:18px}
/* 기준업체 */
.supbar{background:#0f2740;margin:0 -12px;padding:10px 12px 12px;position:sticky;top:0;z-index:50}
.supbar .cap{font-size:.68rem;color:#8ba7c4;font-weight:700;margin-bottom:6px;letter-spacing:.3px}
.sups{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px}
.sp{padding:9px 4px;background:rgba(255,255,255,.09);border:1.5px solid rgba(255,255,255,.18);border-radius:10px;
 text-align:center;cursor:pointer;color:#cfdcea;transition:.12s}
.sp .n{font-size:.92rem;font-weight:800;line-height:1.2}
.sp .b{font-size:.62rem;opacity:.72;margin-top:2px;display:block}
.sp.on{background:#fff;border-color:#fff;color:#0f2740}
.sp.on .b{opacity:.62}
/* 탭 */
.tabs{display:flex;gap:0;background:#fff;border-radius:12px;padding:4px;margin:12px 0 10px;box-shadow:0 1px 3px rgba(20,40,70,.07)}
.tb{flex:1;padding:10px;border-radius:9px;text-align:center;font-weight:800;font-size:.9rem;cursor:pointer;color:#7b8698}
.tb.on{background:#2b5f96;color:#fff}
/* 필터 */
.brands{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.brands::-webkit-scrollbar{display:none}
.bd{flex:0 0 auto;padding:7px 14px;background:#fff;border:1px solid #dde3ec;border-radius:20px;font-size:.84rem;font-weight:700;cursor:pointer;color:#5e6b7e;white-space:nowrap}
.bd.on{background:#16324f;border-color:#16324f;color:#fff}
.tools{display:flex;gap:6px;margin-bottom:10px}
#q{flex:1;padding:9px 12px;border:1px solid #dde3ec;border-radius:9px;font-size:.88rem;font-family:inherit;background:#fff;min-width:0}
#q:focus{outline:none;border-color:#2b5f96}
#sort{padding:9px 10px;border:1px solid #dde3ec;border-radius:9px;font-size:.82rem;font-family:inherit;background:#fff;font-weight:700;color:#5e6b7e}
/* 요약 */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;max-width:520px}
.sm{background:#fff;border-radius:11px;padding:10px 8px;text-align:center;box-shadow:0 1px 3px rgba(20,40,70,.06)}
.sm .k{font-size:.66rem;color:#8b96a8;font-weight:700}
.sm .v{font-size:1.02rem;font-weight:900;margin-top:2px;font-variant-numeric:tabular-nums}
/* 표 */
.tblwrap{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(20,40,70,.06);overflow:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:760px}
thead th{position:sticky;top:0;background:#f2f5f9;color:#5e6b7e;font-size:.74rem;font-weight:800;
 padding:9px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid #e2e8f1;z-index:2}
thead th.l{text-align:left}
thead th.sup{cursor:pointer}
thead th.sup.on{background:#16324f;color:#fff}
tbody td{padding:8px;border-bottom:1px solid #f2f5f9;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody td.l{text-align:left;white-space:normal}
tbody tr:hover td{background:#fafcff}
tr.cat td{background:#eef2f7;font-weight:800;color:#5e6b7e;font-size:.74rem;padding:6px 9px;text-align:left;letter-spacing:.3px}
.nm{font-weight:700;color:#1b2431}
.sub{font-size:.72rem;color:#a5adbb;font-weight:500;margin-left:5px}
td.v{font-weight:700;color:#46536a}
td.v.low{background:#e8f7f1;color:#0b7a6e;font-weight:900}
td.v.base{background:#eaf2fc;color:#16324f;font-weight:900;box-shadow:inset 2px 0 0 #2b5f96,inset -2px 0 0 #2b5f96}
td.v.na{color:#ccd3de;font-weight:500}
td.best{font-weight:800;color:#0b7a6e;font-size:.82rem}
td.gap{text-align:right;font-size:.76rem;color:#c0392b;line-height:1.5;white-space:normal;min-width:210px}
td.gap .up{color:#a5adbb}
td.gap .dn{color:#c0392b;font-weight:800}
td.gap .eq{color:#0b7a6e;font-weight:700}
.hint{font-size:.72rem;color:#a5adbb;margin:8px 2px 0}
.empty{background:#fff;border-radius:11px;padding:26px;text-align:center;color:#a5adbb;font-size:.88rem}
/* 마진 — 반응형(좁게 유지) */
#tab-mgn{max-width:620px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(20,40,70,.06)}
.card h3{margin:0 0 10px;font-size:.82rem;color:#7b8698;font-weight:800}
.row{display:flex;gap:8px;margin-bottom:9px;align-items:center}
.row label{width:76px;font-size:.81rem;font-weight:700;color:#5e6b7e;flex-shrink:0}
.row input,.row select{flex:1;padding:10px 11px;border:1px solid #dde3ec;border-radius:9px;font-size:.92rem;font-family:inherit;min-width:0;background:#fff}
.row input:focus,.row select:focus{outline:none;border-color:#2b5f96}
.seg{display:flex;gap:5px;flex:1}
.sg{flex:1;padding:9px 4px;border:1px solid #dde3ec;background:#fff;border-radius:9px;font-size:.8rem;font-weight:700;cursor:pointer;color:#5e6b7e;font-family:inherit}
.sg.on{background:#2b5f96;border-color:#2b5f96;color:#fff}
.res{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(20,40,70,.06)}
.rh{padding:9px 14px;font-weight:800;font-size:.83rem;color:#fff}
.rl{display:flex;justify-content:space-between;padding:8px 14px;font-size:.86rem;border-bottom:1px solid #f2f5f9}
.rl b{font-variant-numeric:tabular-nums}
.rt{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;font-weight:800}
.rt .v{font-size:1.35rem;font-variant-numeric:tabular-nums}
.note{font-size:.72rem;color:#8b96a8;line-height:1.65;margin-top:14px;padding:12px 13px;background:#e4e9f0;border-radius:10px}
@media(max-width:420px){
 body{font-size:14px}
 .row label{width:66px;font-size:.77rem}
 .sp .n{font-size:.86rem}
}
</style></head><body>
<div id="lock"><div id="lockbox">
  <h2>🔋 국민배터리 지점 단가표</h2>
  <p>지점에 공유된 암호를 입력하세요</p>
  <input id="pw" type="password" inputmode="text" autocomplete="off" placeholder="암호">
  <button id="go">열기</button><div id="err"></div>
</div></div>

<div class="wrap" id="app" style="display:none">
<header>
  <h1>🔋 국민배터리 지점 단가표</h1>
  <div class="sub"><b>2026년 9월 인상단가</b> · VAT 별도 · 실매입가 &nbsp;|&nbsp; 현재 실제 적용단가는 <b>인상 전</b>입니다</div>
</header>
<div class="supbar">
  <div class="cap">기준 업체 — 누르면 그 업체 기준으로 차액이 계산됩니다</div>
  <div class="sups" id="sups"></div>
</div>

<div class="tabs">
  <div class="tb on" data-t="cmp">📊 단가 비교</div>
  <div class="tb" data-t="mgn">💰 마진 계산</div>
</div>

<div class="brands" id="brands"></div>

<div id="tab-cmp">
  <div class="tools">
    <input id="q" placeholder="규격 검색 — GB57820, AGM80, DIN74 …">
    <select id="sort">
      <option value="cat">규격순</option>
      <option value="gap">차액 큰 순</option>
      <option value="low">저가순</option>
    </select>
  </div>
  <div class="sum" id="sum"></div>
  <div id="list"></div>
</div>

<div id="tab-mgn" style="display:none">
  <div class="card">
    <h3>제품 선택</h3>
    <div class="row"><label>제품</label><select id="mItem"></select></div>
    <div class="row"><label>매입가</label><input id="mBuy" type="number" inputmode="numeric"></div>
    <div class="row"><label>판매가</label><input id="mSell" type="number" inputmode="numeric" placeholder="예: 150000"></div>
  </div>
  <div class="card">
    <h3>조건</h3>
    <div class="row"><label>결제</label><div class="seg" id="mPay">
      <button class="sg on" data-f="0.002">카드 0.2%</button>
      <button class="sg" data-f="0.05">스스 5%</button>
      <button class="sg" data-f="0">현금</button></div></div>
    <div class="row"><label>폐전지</label><div class="seg" id="mWst">
      <button class="sg on" data-w="1">반납 받음</button>
      <button class="sg" data-w="0">없음</button></div></div>
    <div class="row"><label>단가·무게</label>
      <input id="mRate" type="number" inputmode="numeric" value="1320" style="flex:1">
      <input id="mKg" type="number" inputmode="decimal" step="0.5" style="flex:.8" placeholder="kg"></div>
  </div>
  <div class="res" id="mRes"></div>
  <div class="note">폐전지 매각액은 <b>공급가 + VAT</b>로 들어옵니다(kg × 단가 × 1.1).<br>
  부가세 = 매출세액 + 폐전지세액 − 매입세액 − 수수료세액 &nbsp;/&nbsp; 세후순익 = 현금마진 − 납부부가세.<br>
  <b>매장 판매 기준</b>입니다. 택배는 CJ 운임이 추가로 빠집니다.</div>
</div>

<div class="note" id="foot"></div>
</div>

function price(r,k){
  if(k==='yd6'){ return (r.b==='로케트'&&r.yd!=null)?Math.round(r.yd*0.94):null; }  /* 공장직송 6% — 로케트만 */
  var v=r[k];if(v==null)return null;return (k==='yd')?Math.round(v*0.97):v;}

async function unlock(){
  var pw=document.getElementById('pw').value.trim(); if(!pw)return;
  var e=document.getElementById('err');e.textContent='여는 중…';e.style.color='#5e6b7e';
  try{
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.s),iterations:PAYLOAD.i,hash:'SHA-256'},
             km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.v)},key,b64(PAYLOAD.c));
    DB=JSON.parse(new TextDecoder().decode(pt));
    try{localStorage.setItem('kbp_pw',pw);}catch(x){}
    document.getElementById('lock').style.display='none';
    document.getElementById('app').style.display='';
    init();
  }catch(x){e.style.color='#c0392b';e.textContent='암호가 맞지 않습니다';}
}
document.getElementById('go').onclick=unlock;
document.getElementById('pw').addEventListener('keydown',function(ev){if(ev.key==='Enter')unlock();});
(function(){try{var p=localStorage.getItem('kbp_pw');if(p){document.getElementById('pw').value=p;unlock();}}catch(x){}})();

function init(){
  try{SUP=localStorage.getItem('kbp_sup')||'yd';BRAND=localStorage.getItem('kbp_brand')||'로케트';}catch(x){}
  if(KEYS.indexOf(SUP)<0)SUP='yd';
  if(DB.brands.indexOf(BRAND)<0)BRAND=DB.brands[0];
  document.getElementById('sups').innerHTML=SUPS.map(function(s){
    return '<div class="sp'+(s.k===SUP?' on':'')+'" data-k="'+s.k+'"><div class="n">'+s.n+'</div><span class="b">'+s.b+'</span></div>';}).join('');
  document.getElementById('brands').innerHTML=DB.brands.map(function(b){
    return '<div class="bd'+(b===BRAND?' on':'')+'" data-b="'+b+'">'+b+'</div>';}).join('');
  document.getElementById('foot').innerHTML='기준 '+DB.meta.date+' · <b>영도만 협력할인 3%</b>(정가×0.97) 적용 · 퍼스트·SB·영창은 <b>할인 없음</b>(표시가=매입가).<br>'
    +'업체별 거래 지점 — 영도·퍼스트=본점·동부산점 / SB=서부점 / 영창=서울점 / 다원=9월 인상단가(할인 없음).<br>'
    +'<b>영도 직송</b> = 로케트 공장직송 선택 시 6% 할인(정가×0.94) — <b>로케트만 해당·아직 미결정</b>. 협상 참고용 가정치입니다.';
  bind();refresh();
}
function bind(){
  document.getElementById('sups').onclick=function(e){
    var t=e.target.closest('.sp');if(!t)return;
    SUP=t.dataset.k;try{localStorage.setItem('kbp_sup',SUP);}catch(x){}
    [].forEach.call(document.querySelectorAll('.sp'),function(x){x.classList.toggle('on',x.dataset.k===SUP);});
    refresh();
  };
  document.getElementById('brands').onclick=function(e){
    var t=e.target.closest('.bd');if(!t)return;
    BRAND=t.dataset.b;try{localStorage.setItem('kbp_brand',BRAND);}catch(x){}
    [].forEach.call(document.querySelectorAll('.bd'),function(x){x.classList.toggle('on',x.dataset.b===BRAND);});
    refresh();
  };
  document.getElementById('q').oninput=render;
  document.getElementById('sort').onchange=render;
  [].forEach.call(document.querySelectorAll('.tb'),function(t){t.onclick=function(){
    [].forEach.call(document.querySelectorAll('.tb'),function(x){x.classList.remove('on');});
    t.classList.add('on');
    var c=(t.dataset.t==='cmp');
    document.getElementById('tab-cmp').style.display=c?'':'none';
    document.getElementById('tab-mgn').style.display=c?'none':'';
    window.scrollTo(0,0);
  };});
  document.getElementById('list').onclick=function(e){
    var th=e.target.closest('th.sup');if(!th)return;
    SUP=th.dataset.k;try{localStorage.setItem('kbp_sup',SUP);}catch(x){}
    [].forEach.call(document.querySelectorAll('.sp'),function(x){x.classList.toggle('on',x.dataset.k===SUP);});
    refresh();
  };
  ['mBuy','mSell','mRate','mKg'].forEach(function(id){document.getElementById(id).oninput=calc;});
  document.getElementById('mItem').onchange=function(){pickItem();calc();};
  ['mPay','mWst'].forEach(function(id){document.getElementById(id).onclick=function(e){
    var t=e.target.closest('.sg');if(!t)return;
    [].forEach.call(this.querySelectorAll('.sg'),function(x){x.classList.remove('on');});
    t.classList.add('on');calc();};});
}
function refresh(){render();fillItems();}
function rowsOf(){
  var q=(document.getElementById('q').value||'').trim().toLowerCase();
  var rs=DB.rows.filter(function(r){return r.b===BRAND;});
  if(q)rs=rs.filter(function(r){return (r.n+' '+r.c).toLowerCase().indexOf(q)>=0;});
  return rs;
}
function render(){
  var rs=rowsOf(),sort=document.getElementById('sort').value;
  var calcd=rs.map(function(r){
    var v={},min=null,minK=null;
    KEYS.forEach(function(k){var p=price(r,k);v[k]=p;if(p!=null&&(min==null||p<min)){min=p;minK=k;}});
    return {r:r,v:v,min:min,minK:minK,me:v[SUP],gap:(v[SUP]!=null&&min!=null)?(v[SUP]-min):null};
  });
  var have=calcd.filter(function(c){return c.me!=null;});
  var best=have.filter(function(c){return c.gap===0;}).length;
  var over=have.filter(function(c){return c.gap>0;});
  var avg=over.length?Math.round(over.reduce(function(a,c){return a+c.gap;},0)/over.length):0;
  document.getElementById('sum').innerHTML=
     '<div class="sm"><div class="k">'+SUPNM[SUP]+' 취급</div><div class="v">'+have.length+'<span style="font-size:.7rem;color:#a5adbb">/'+calcd.length+'</span></div></div>'
    +'<div class="sm"><div class="k">최저가 품목</div><div class="v" style="color:#0b7a6e">'+best+'</div></div>'
    +'<div class="sm"><div class="k">더 비싼 품목</div><div class="v" style="color:'+(over.length?'#c0392b':'#0b7a6e')+'">'+over.length
    +(over.length?'<span style="font-size:.66rem;color:#a5adbb"> 평균+'+won(avg)+'</span>':'')+'</div></div>';
  if(sort==='gap')calcd.sort(function(a,b){return (b.gap==null?-1:b.gap)-(a.gap==null?-1:a.gap);});
  else if(sort==='low')calcd.sort(function(a,b){return (a.me==null?9e9:a.me)-(b.me==null?9e9:b.me);});
  var grouped=(sort==='cat');
  var h='<div class="tblwrap"><table><thead><tr><th class="l">'+BRAND+'</th>';
  KEYS.forEach(function(k){h+='<th class="sup'+(k===SUP?' on':'')+'" data-k="'+k+'">'+SUPNM[k]+'</th>';});
  h+='<th>최저</th><th class="l">차액 ('+SUPNM[SUP]+' 기준)</th></tr></thead><tbody>';
  var lastc=null;
  calcd.forEach(function(c){
    var r=c.r;
    if(grouped&&r.c!==lastc){h+='<tr class="cat"><td colspan="7">'+r.c+'</td></tr>';lastc=r.c;}
    h+='<tr><td class="l"><span class="nm">'+r.n+'</span>'+(grouped?'':'<span class="sub">'+r.c+'</span>')+'</td>';
    KEYS.forEach(function(k){
      var p=c.v[k],cls='v';
      if(p==null)cls+=' na';
      else{if(p===c.min)cls+=' low'; if(k===SUP)cls+=' base';}
      h+='<td class="'+cls+'">'+won(p)+'</td>';
    });
    h+='<td class="best">'+(c.minK?SUPNM[c.minK]:'—')+'</td>';
    var g='';
    if(c.me==null)g='<span class="up">'+SUPNM[SUP]+' 미취급</span>';
    else{
      var parts=KEYS.filter(function(k){return k!==SUP&&c.v[k]!=null;}).map(function(k){
        var d=c.v[k]-c.me;
        if(d===0)return '<span class="eq">'+SUPNM[k]+' 동일</span>';
        return '<span class="'+(d>0?'up':'dn')+'">'+SUPNM[k]+' '+(d>0?'+':'')+won(d)+'</span>';
      });
      g=parts.join(' · ')||'<span class="up">비교 대상 없음</span>';
    }
    h+='<td class="gap">'+g+'</td></tr>';
  });
  h+='</tbody></table></div><div class="hint">초록=최저가 · 파랑테두리=기준 업체 · 차액에서 <b style="color:#c0392b">빨강(−)</b>은 그 업체가 더 싸다는 뜻입니다. 표 머리의 업체명을 눌러도 기준이 바뀝니다.</div>';
  document.getElementById('list').innerHTML=calcd.length?h:'<div class="empty">검색 결과가 없습니다</div>';
}
function fillItems(){
  var rs=DB.rows.filter(function(r){return r.b===BRAND&&price(r,SUP)!=null;});
  var sel=document.getElementById('mItem'),prev=sel.value;
  sel.innerHTML=rs.map(function(r){
    return '<option value="'+r.i+'">'+r.n+' — '+won(price(r,SUP))+'원</option>';}).join('')
    ||'<option value="">'+SUPNM[SUP]+' 취급 품목 없음</option>';
  if(prev&&[].some.call(sel.options,function(o){return o.value===prev;}))sel.value=prev;
  pickItem();calc();
}
function pickItem(){
  var id=document.getElementById('mItem').value;
  var r=DB.rows.filter(function(x){return String(x.i)===String(id);})[0];
  if(!r){document.getElementById('mBuy').value='';return;}
  document.getElementById('mBuy').value=price(r,SUP)||'';
  document.getElementById('mKg').value=r.w||'';
}
function calc(){
  var buy=+document.getElementById('mBuy').value||0,sell=+document.getElementById('mSell').value||0;
  var fee=+document.querySelector('#mPay .sg.on').dataset.f;
  var wOn=document.querySelector('#mWst .sg.on').dataset.w==='1';
  var rate=+document.getElementById('mRate').value||0,kg=+document.getElementById('mKg').value||0;
  var box=document.getElementById('mRes');
  if(!sell||!buy){box.innerHTML='<div class="rh" style="background:#a5adbb">판매가를 입력하면 계산됩니다</div>';return;}
  var bv=Math.round(buy*1.1),ws=wOn?Math.round(kg*rate):0,wt=Math.round(ws*1.1),fe=Math.round(sell*fee);
  var cash=sell+wt-bv-fe;
  var vat=Math.round(sell/1.1*0.1+ws*0.1-buy*0.1-fe/1.1*0.1);
  var net=cash-vat,pos=net>=0;
  var rate2=sell?Math.round(net/sell*1000)/10:0;
  box.innerHTML='<div class="rh" style="background:'+(pos?'#0b7a6e':'#c0392b')+'">'+(pos?'💰':'⚠️')+' '+SUPNM[SUP]+' 매입 기준</div>'
   +'<div class="rl"><span>판매가</span><b>+'+won(sell)+'</b></div>'
   +(wOn?'<div class="rl"><span>폐전지 매각 ('+kg+'kg × '+won(rate)+')</span><b>+'+won(wt)+'</b></div>':'')
   +'<div class="rl"><span>배터리 매입 (VAT포함)</span><b>-'+won(bv)+'</b></div>'
   +(fe?'<div class="rl"><span>결제 수수료</span><b>-'+won(fe)+'</b></div>':'')
   +'<div class="rl" style="background:#f7f9fc;font-weight:700"><span>현금 마진</span><b>'+won(cash)+'</b></div>'
   +'<div class="rl"><span>납부 부가세</span><b>-'+won(vat)+'</b></div>'
   +'<div class="rt" style="background:'+(pos?'#e3f6ef':'#fdeceb')+';color:'+(pos?'#0b7a6e':'#c0392b')+'">'
   +'<span>세후 순익<span style="font-size:.72rem;font-weight:600;color:#8b96a8"> · 마진율 '+rate2+'%</span></span>'
   +'<span class="v">'+won(net)+'원</span></div>';
}
</script></body></html>
