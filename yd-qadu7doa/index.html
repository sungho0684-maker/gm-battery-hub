var D=null,PSET='post',SVIEW='brand',SPEC='80',ONLY=false;
try{PSET=localStorage.getItem('yds_pset')||PSET;SVIEW=localStorage.getItem('yds_sview')||SVIEW;SPEC=localStorage.getItem('yds_spec')||SPEC;ONLY=localStorage.getItem('yds_only')==='1';}catch(e){}
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function unlock(){
  var pw=document.getElementById('pw').value.trim();if(!pw)return;
  var err=document.getElementById('err');err.textContent='여는 중...';
  try{
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.s),iterations:PAYLOAD.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.v)},key,b64(PAYLOAD.c));
    D=JSON.parse(new TextDecoder().decode(pt));
  }catch(x){err.textContent='암호가 맞지 않습니다';try{localStorage.removeItem('yds_pw');}catch(e){}return;}
  try{localStorage.setItem('yds_pw',pw);}catch(e){}
  var st=document.createElement('style');st.textContent=D.css||'';document.head.appendChild(st);
  document.getElementById('stamp').textContent='기준 '+D.stamp;
  document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';
  render();
}
function keyOf(){if(SVIEW==='spec')return PSET+'|spec';return (PSET==='cmp'&&ONLY)?'cmp|brand|only':PSET+'|brand';}
function render(){
  var box=document.getElementById('supcmp');box.innerHTML=D.R[keyOf()]||'';
  box.querySelectorAll('.psbar button').forEach(function(b){b.classList.toggle('on',b.dataset.k===PSET);});
  box.querySelectorAll('.svbar button').forEach(function(b){b.classList.toggle('on',b.dataset.v===SVIEW);});
  box.querySelectorAll('input[type=checkbox]').forEach(function(c){if((c.getAttribute('onchange')||'').indexOf('triOnly')>=0)c.checked=ONLY;});
  if(SVIEW==='spec'){
    var chips=box.querySelectorAll('.spchips button'),ok=false;
    chips.forEach(function(b){if(b.dataset.c===SPEC)ok=true;});if(!ok)SPEC='all';
    chips.forEach(function(b){b.classList.toggle('on',b.dataset.c===SPEC);});
    box.querySelectorAll('[data-spec]').forEach(function(el){el.style.display=(SPEC==='all'||el.dataset.spec===SPEC)?'':'none';});
  }
  try{localStorage.setItem('yds_pset',PSET);localStorage.setItem('yds_sview',SVIEW);localStorage.setItem('yds_spec',SPEC);localStorage.setItem('yds_only',ONLY?'1':'0');}catch(e){}
}
function setPset(k){PSET=k;render();}
function setSview(v){SVIEW=v;render();}
function setSpec(c){SPEC=c;render();}
function triOnly(v){ONLY=!!v;render();}
document.getElementById('pw').addEventListener('keydown',function(ev){if(ev.key==='Enter')unlock();});
(function(){try{var p=localStorage.getItem('yds_pw');if(p){document.getElementById('pw').value=p;unlock();}}catch(e){}})();
</script>
